name: Deploy a Vercel

on:
  push:
    branches: [master, main, SSAAVEDRA, 'claude/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Deshabilitar confirmación de email en Supabase
        run: |
          curl -s -X PATCH \
            "https://api.supabase.com/v1/projects/bogdnblwcdiydybnsqni/config/auth" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"mailer_autoconfirm": true}' || echo "Supabase token no configurado - omitido"

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://bogdnblwcdiydybnsqni.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_J1CE-n4ACpcziRylkTjCFw_EV0bASD_

      - name: Deploy a Vercel
        run: npx vercel --token ${{ secrets.VERCEL_TOKEN }} --prod --yes
