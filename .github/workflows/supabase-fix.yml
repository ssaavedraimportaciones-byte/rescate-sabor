name: Fix Supabase Auth
on:
  push:
    branches: ['claude/**']
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Deshabilitar confirmacion email Supabase
        run: |
          RESULT=$(curl -s -w "\nHTTP:%{http_code}" \
            -X PATCH \
            "https://api.supabase.com/v1/projects/bogdnblwcdiydybnsqni/config/auth" \
            -H "Authorization: Bearer sbp_v0_bb4734ef5ddd55c73fa759a024f114f66678838e" \
            -H "Content-Type: application/json" \
            -d '{"mailer_autoconfirm": true}')
          echo "$RESULT"
