<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />

    <!-- SEO y redes sociales -->
    <title>Rescate Sabor — Bolsas sorpresa a precio justo</title>
    <meta name="description" content="Rescata comida, reduce el desperdicio. Compra bolsas sorpresa de tiendas locales con hasta 70% de descuento." />
    <meta name="theme-color" content="#f97316" />

    <!-- Open Graph -->
    <meta property="og:title" content="Rescate Sabor" />
    <meta property="og:description" content="Bolsas sorpresa de comida a precio reducido. Menos desperdicio, más sabor." />
    <meta property="og:image" content="/logo.svg" />
    <meta property="og:type" content="website" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rescate Sabor" />

    <!-- Limpiar caché y SW viejos -->
    <script>
      (function() {
        var APP_VERSION = '20260417-v7';
        if (localStorage.getItem('app_version') !== APP_VERSION) {
          localStorage.setItem('app_version', APP_VERSION);
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              regs.forEach(function(r) { r.unregister(); });
            });
          }
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              keys.forEach(function(k) { caches.delete(k); });
            });
          }
        }
      })();
    </script>

    <!-- GitHub Pages SPA: restore path from 404 redirect -->
    <script>
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
