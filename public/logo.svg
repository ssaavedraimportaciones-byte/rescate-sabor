<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg" cx="42%" cy="36%" r="72%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="55%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </radialGradient>
  </defs>

  <!-- Fondo circular -->
  <circle cx="100" cy="100" r="100" fill="url(#bg)"/>

  <!-- Corazón-hoja GRANDE: rellena ~88% del círculo -->
  <path d="M100 178
           C76 156 20 126 20 80
           C20 52 42 30 70 30
           C84 30 95 43 100 52
           C105 43 116 30 130 30
           C158 30 180 52 180 80
           C180 126 124 156 100 178Z"
        fill="white"/>

  <!-- Nervadura central — gruesa y visible -->
  <path d="M100 52 L100 170" stroke="#ea580c" stroke-width="6" stroke-linecap="round" opacity="0.55"/>

  <!-- Nervaduras superiores — bien visibles -->
  <path d="M100 78 Q66 94 38 106" stroke="#ea580c" stroke-width="4.5" stroke-linecap="round" opacity="0.5"/>
  <path d="M100 78 Q134 94 162 106" stroke="#ea580c" stroke-width="4.5" stroke-linecap="round" opacity="0.5"/>

  <!-- Nervaduras medias -->
  <path d="M100 110 Q70 126 46 136" stroke="#ea580c" stroke-width="3.5" stroke-linecap="round" opacity="0.4"/>
  <path d="M100 110 Q130 126 154 136" stroke="#ea580c" stroke-width="3.5" stroke-linecap="round" opacity="0.4"/>

  <!-- Nervaduras inferiores -->
  <path d="M100 138 Q80 148 64 156" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>
  <path d="M100 138 Q120 148 136 156" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>

  <!-- Brote verde en la punta superior -->
  <path d="M100 30 C100 30 79 12 89 3 C97 15 100 30 100 30Z" fill="#4ade80"/>
  <path d="M100 30 C100 30 121 14 129 27 C121 35 100 30 100 30Z" fill="#22c55e"/>
  <line x1="100" y1="30" x2="100" y2="13" stroke="#15803d" stroke-width="4" stroke-linecap="round"/>
</svg>
