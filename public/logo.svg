  <path d="M100 58 L100 164" stroke="#f97316" stroke-width="4" stroke-linecap="round" opacity="0.45"/>

  <!-- Nervaduras laterales superiores -->
  <path d="M100 80 Q70 98 46 108" stroke="#f97316" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
  <path d="M100 80 Q130 98 154 108" stroke="#f97316" stroke-width="3" stroke-linecap="round" opacity="0.3"/>

  <!-- Nervaduras laterales inferiores -->
  <path d="M100 110 Q74 126 54 134" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" opacity="0.25"/>
  <path d="M100 110 Q126 126 146 134" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" opacity="0.25"/>

  <!-- Nervaduras pequeñas -->
  <path d="M100 140 Q82 148 68 154" stroke="#f97316" stroke-width="2" stroke-linecap="round" opacity="0.2"/>
  <path d="M100 140 Q118 148 132 154" stroke="#f97316" stroke-width="2" stroke-linecap="round" opacity="0.2"/>

  <!-- Brote verde en la punta superior (vida que renace) -->
