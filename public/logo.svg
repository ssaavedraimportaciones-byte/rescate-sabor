<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>

    <!-- ─── GRADIENTES ─── -->

    <!-- Arco: verde profundo → verde brillante → naranja brillante → naranja profundo -->
    <linearGradient id="arc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#16652a"/>
      <stop offset="30%"  stop-color="#3db535"/>
      <stop offset="70%"  stop-color="#e07818"/>
      <stop offset="100%" stop-color="#d96600"/>
    </linearGradient>

    <!-- Bowl: verde claro (top-left) → verde oscuro (bottom-right) -->
    <radialGradient id="bowl" cx="32%" cy="28%" r="72%">
      <stop offset="0%"   stop-color="#7ce86a"/>
      <stop offset="100%" stop-color="#145a22"/>
    </radialGradient>

    <!-- Hoja grande (delantera) -->
    <linearGradient id="leaf1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#5dd64a"/>
      <stop offset="100%" stop-color="#145a22"/>
    </linearGradient>

    <!-- Hoja pequeña (trasera) -->
    <linearGradient id="leaf2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#3aab2e"/>
      <stop offset="100%" stop-color="#0f4a1a"/>
    </linearGradient>

  </defs>

  <!-- ══════════════════════════════════════
       FLECHAS CIRCULARES
       Centro (100,96) • Radio 68
       Arco inferior: 180°→0° (por abajo)
       Arco superior: 0°→180° (por arriba)
       ══════════════════════════════════════ -->

  <!-- Arco que va por ARRIBA (de izquierda a derecha) -->
  <path d="M 32,96 A 68,68 0 0,1 168,96"
        fill="none" stroke="url(#arc)"
        stroke-width="17" stroke-linecap="butt"/>

  <!-- Arco que va por ABAJO (de derecha a izquierda) -->
  <path d="M 168,96 A 68,68 0 0,1 32,96"
        fill="none" stroke="url(#arc)"
        stroke-width="17" stroke-linecap="butt"/>

  <!-- Punta VERDE integrada (izquierda, apunta arriba)
       Triángulo del ancho exacto del trazo -->
  <polygon points="32,96  22,96  32,74  42,96"
           fill="#16652a"/>

  <!-- Punta NARANJA integrada (derecha, apunta abajo) -->
  <polygon points="168,96  158,96  168,118  178,96"
           fill="#d96600"/>

  <!-- ══════════════════════════════════════
       BOWL — curva cúbica suave
       ══════════════════════════════════════ -->

  <!-- Cuerpo (bezier redondeado) -->
  <path d="M 44,104
           C 42,154  66,178 100,180
           C 134,178 158,154 156,104 Z"
        fill="url(#bowl)"/>

  <!-- Gloss lateral izquierdo -->
  <ellipse cx="64" cy="138" rx="8" ry="22"
           fill="rgba(255,255,255,0.25)"
           transform="rotate(-20,64,138)"/>

  <!-- Rim naranja del bowl -->
  <ellipse cx="100" cy="104" rx="56" ry="10.5" fill="#d96600"/>

  <!-- Borde interno (reflejo blanco) -->
  <ellipse cx="100" cy="102" rx="46" ry="7"
           fill="rgba(255,255,255,0.32)"/>

  <!-- Base del bowl -->
  <path d="M 84,177 Q 84,185 100,186 Q 116,185 116,177 Z"
        fill="#145a22"/>
  <ellipse cx="100" cy="186" rx="22" ry="5" fill="#0f4a1a"/>

  <!-- ══════════════════════════════════════
       TENEDOR — path vectorial real
       Centro x=80, dientes desde y=54 a y=80
       ══════════════════════════════════════ -->
  <path d="
    M 85,112  Q 85,117 80,117  Q 75,117 75,112
    L 75,82   L 71,77
    L 71,54   Q 71,50 73.5,50  Q 76,50 76,54
    L 76,74   L 78,74  L 78,54
    Q 78,50 80,50  Q 82,50 82,54
    L 82,74   L 84,74  L 84,54
    Q 84,50 86.5,50  Q 89,50 89,54
    L 89,77   L 85,82
    Z"
    fill="#d96600"/>

  <!-- ══════════════════════════════════════
       HOJAS — bezier orgánicas elegantes
       ══════════════════════════════════════ -->

  <!-- Hoja trasera (izquierda, x=112) -->
  <path d="M 112,100
           C 100,87  99,60  112,44
           C 125,60 124,87  112,100 Z"
        fill="url(#leaf2)"/>
  <line x1="112" y1="100" x2="112" y2="48"
        stroke="#0f4a1a" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Hoja delantera (derecha, x=127, más grande) -->
  <path d="M 127,100
           C 113,86  112,56  127,38
           C 142,56 141,86  127,100 Z"
        fill="url(#leaf1)"/>
  <line x1="127" y1="100" x2="127" y2="42"
        stroke="#0f4a1a" stroke-width="1.6" stroke-linecap="round"/>

</svg>
