<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="arcG" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%"   stop-color="#1a7a2e"/>
      <stop offset="38%"  stop-color="#3db83a"/>
      <stop offset="62%"  stop-color="#e07820"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="bowlG" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%"   stop-color="#6dcf55"/>
      <stop offset="45%"  stop-color="#2fa832"/>
      <stop offset="100%" stop-color="#1b6b28"/>
    </linearGradient>
    <radialGradient id="shineG" cx="32%" cy="28%" r="52%">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.45)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <linearGradient id="leafG" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%"   stop-color="#1a6b28"/>
      <stop offset="100%" stop-color="#4ec245"/>
    </linearGradient>
    <linearGradient id="rimG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#e07820"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
  </defs>

  <!-- ══════ ARCOS CIRCULARES ══════ -->
  <!-- Arco inferior — detrás del bowl -->
  <path d="M 157,87 A 57,57 0 0,1 43,87"
        fill="none" stroke="url(#arcG)" stroke-width="16" stroke-linecap="butt"/>
  <!-- Arco superior -->
  <path d="M 43,87 A 57,57 0 0,1 157,87"
        fill="none" stroke="url(#arcG)" stroke-width="16" stroke-linecap="butt"/>

  <!-- Flecha VERDE izquierda (43,87) → ARRIBA -->
  <polygon points="0,-16 13,8 -13,8"
           transform="translate(43,87) rotate(0)"
           fill="#1a7a2e"/>
  <!-- Flecha NARANJA derecha (157,87) → ABAJO -->
  <polygon points="0,-16 13,8 -13,8"
           transform="translate(157,87) rotate(180)"
           fill="#f57c00"/>

  <!-- ══════ BOWL ══════ -->
  <!-- Cuerpo principal -->
  <path d="M 42,94 Q 40,158 100,163 Q 160,158 158,94 Z"
        fill="url(#bowlG)"/>
  <!-- Brillo radial 3D -->
  <path d="M 42,94 Q 40,158 100,163 Q 160,158 158,94 Z"
        fill="url(#shineG)"/>
  <!-- Brillo lateral izquierdo -->
  <path d="M 53,110 Q 47,134 54,153"
        fill="none" stroke="rgba(255,255,255,0.40)" stroke-width="14" stroke-linecap="round"/>

  <!-- Aro/borde naranja -->
  <ellipse cx="100" cy="94"  rx="58"  ry="12.5" fill="url(#rimG)"/>
  <!-- Reflejo blanco interior -->
  <ellipse cx="100" cy="92"  rx="48"  ry="8.5"  fill="rgba(255,255,255,0.28)"/>

  <!-- Base del bowl -->
  <rect   x="82"  y="160" width="36" height="7"   rx="3.5" fill="#156b24"/>
  <ellipse cx="100" cy="167" rx="26" ry="5.5"         fill="#1a7030"/>

  <!-- ══════ TENEDOR naranja ══════ -->
  <!-- Tine izquierdo -->
  <rect x="74" y="52" width="5.5" height="30" rx="2.8" fill="#f57c00"/>
  <!-- Tine derecho -->
  <rect x="84" y="52" width="5.5" height="30" rx="2.8" fill="#f57c00"/>
  <!-- Barra conectora -->
  <rect x="74" y="79" width="15.5" height="6" rx="3" fill="#f57c00"/>
  <!-- Mango -->
  <rect x="77.5" y="84" width="9" height="32" rx="4.5" fill="#f57c00"/>

  <!-- ══════ HOJAS verdes ══════ -->
  <!-- Hoja 1 (atrás, izquierda) -->
  <path d="M 111,92 C 106,91 102,60 120,46 C 134,49 130,88 111,92 Z"
        fill="url(#leafG)" opacity="0.92"/>
  <line x1="111" y1="92" x2="120" y2="49"
        stroke="#156b24" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Hoja 2 (frente, derecha) -->
  <path d="M 126,92 C 121,91 117,60 135,46 C 149,49 145,88 126,92 Z"
        fill="url(#leafG)"/>
  <line x1="126" y1="92" x2="135" y2="49"
        stroke="#156b24" stroke-width="1.8" stroke-linecap="round"/>
</svg>
