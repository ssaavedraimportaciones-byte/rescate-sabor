<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg" cx="42%" cy="36%" r="72%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="55%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fondo circular con gradiente cálido -->
  <circle cx="100" cy="100" r="100" fill="url(#bg)"/>

  <!-- Anillo interior sutil -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>

  <!-- Corazón-hoja: forma que une "amor por la comida" + "rescate ecológico" -->
  <path d="M100 148
           C84 132 60 116 60 95
           C60 80 70 70 82 70
           C89 70 95 75 100 81
           C105 75 111 70 118 70
           C130 70 140 80 140 95
           C140 116 116 132 100 148Z"
        fill="white" filter="url(#glow)"/>

  <!-- Nervaduras del corazón-hoja (patrón de hoja) -->
  <path d="M100 81 L100 140" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
  <path d="M100 93  Q84 102 76 110"  stroke="#f97316" stroke-width="1.8" stroke-linecap="round" opacity="0.4"/>
  <path d="M100 93  Q116 102 124 110" stroke="#f97316" stroke-width="1.8" stroke-linecap="round" opacity="0.4"/>
  <path d="M100 107 Q85 115 79 122"  stroke="#f97316" stroke-width="1.4" stroke-linecap="round" opacity="0.3"/>
  <path d="M100 107 Q115 115 121 122" stroke="#f97316" stroke-width="1.4" stroke-linecap="round" opacity="0.3"/>

  <!-- Brote verde en la punta: simboliza vida que renace (rescate) -->
  <path d="M100 70 C100 70 88 52 95 42 C99 52 100 70 100 70Z" fill="#4ade80"/>
  <path d="M100 70 C100 70 114 55 120 63 C113 70 100 70 100 70Z" fill="#22c55e"/>
  <!-- Tallo del brote -->
  <line x1="100" y1="70" x2="100" y2="56" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>

  <!-- Chispas decorativas (magia del rescate) -->
  <circle cx="57"  cy="62" r="4.5" fill="rgba(255,255,255,0.75)"/>
  <circle cx="47"  cy="80" r="2.8" fill="rgba(255,255,255,0.50)"/>
  <circle cx="68"  cy="50" r="2"   fill="rgba(255,255,255,0.40)"/>

  <circle cx="143" cy="62" r="4.5" fill="rgba(255,255,255,0.75)"/>
  <circle cx="153" cy="80" r="2.8" fill="rgba(255,255,255,0.50)"/>
  <circle cx="132" cy="50" r="2"   fill="rgba(255,255,255,0.40)"/>
</svg>
