      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="55%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
  </defs>

  <!-- Fondo circular -->
  <circle cx="100" cy="100" r="100" fill="url(#bg)"/>

  <!-- Corazón-hoja GRANDE: ocupa ~80% del círculo -->
  <path d="M100 172
           C80 152 26 124 26 82
           C26 56 46 36 74 36
           C87 36 96 48 100 56
           C104 48 113 36 126 36
           C154 36 174 56 174 82
           C174 124 120 152 100 172Z"
