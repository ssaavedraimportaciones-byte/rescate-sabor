<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220">
  <defs>
    <linearGradient id="bowlGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>

  <!-- Arco naranja: sentido horario desde ~305° (arriba-izq) pasando por arriba y derecha hasta ~130° (abajo-der) -->
  <path d="M 40.4,61.3 A 85,85 0 1,1 175.1,164.6"
        fill="none" stroke="#f97316" stroke-width="16" stroke-linecap="butt"/>
  <!-- Punta de flecha naranja al final del arco (~130°) -->
  <polygon points="0,0 -16,-7 -16,7" transform="translate(175.1,164.6) rotate(130)" fill="#f97316"/>

  <!-- Arco verde: sentido horario desde ~150° (abajo-der) pasando por abajo e izquierda hasta ~305° (arriba-izq) -->
  <path d="M 152.5,183.6 A 85,85 0 0,1 40.4,61.3"
        fill="none" stroke="#166534" stroke-width="16" stroke-linecap="butt"/>
  <!-- Punta de flecha verde al final del arco (~305°) -->
  <polygon points="0,0 -16,-7 -16,7" transform="translate(40.4,61.3) rotate(-55)" fill="#166534"/>

  <!-- Bowl: cuerpo verde -->
  <path d="M 66,137 Q 65,188 110,191 Q 155,188 154,137 Z" fill="url(#bowlGrad)"/>

  <!-- Bowl: borde naranja superior -->
  <ellipse cx="110" cy="137" rx="44" ry="9" fill="#f97316"/>
  <!-- Línea blanca que separa borde del bowl -->
  <ellipse cx="110" cy="136" rx="38" ry="5" fill="rgba(255,255,255,0.25)"/>

  <!-- Bowl: brillo reflejo izquierdo -->
  <path d="M 76,150 Q 74,177 89,186" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="7" stroke-linecap="round"/>

  <!-- Tenedor naranja (izquierda del bowl) -->
  <!-- Púas (3) -->
  <rect x="93" y="99" width="3.5" height="22" rx="1.5" fill="#f97316"/>
  <rect x="100" y="99" width="3.5" height="22" rx="1.5" fill="#f97316"/>
  <rect x="107" y="99" width="3.5" height="22" rx="1.5" fill="#f97316"/>
  <!-- Unión/cuello del tenedor -->
  <rect x="95" y="119" width="13" height="5" rx="1.5" fill="#f97316"/>
  <!-- Mango del tenedor -->
  <rect x="98" y="122" width="7" height="20" rx="3" fill="#f97316"/>

  <!-- Hojas verdes (derecha del bowl) -->
  <!-- Hoja trasera (verde claro) -->
  <path d="M 124,140 C 120,140 114,116 127,104 C 139,106 138,133 124,140Z" fill="#22c55e"/>
  <line x1="124" y1="140" x2="128" y2="107" stroke="#166534" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Hoja delantera (verde oscuro) -->
  <path d="M 137,143 C 133,143 129,117 143,106 C 154,109 151,137 137,143Z" fill="#16a34a"/>
  <line x1="137" y1="143" x2="142" y2="109" stroke="#14532d" stroke-width="1.5" stroke-linecap="round"/>
</svg>
