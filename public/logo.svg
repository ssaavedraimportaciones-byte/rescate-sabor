<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220">
  <defs>
    <!-- Verde: vida, naturaleza, sostenibilidad -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#2ecc71"/>
      <stop offset="100%" stop-color="#27ae60"/>
    </linearGradient>

    <!-- Naranja: energía, acción, rescate -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>

    <!-- Bowl: degradado realista -->
    <radialGradient id="bowlGrad" cx="40%" cy="30%" r="70%">
      <stop offset="0%"   stop-color="#f39c12"/>
      <stop offset="100%" stop-color="#d68910"/>
    </radialGradient>
  </defs>

  <!-- ════════════════════════════════════════════════════════
       CÍRCULO DE RECICLAJE — 3 flechas/segmentos curvados
       Centro (110,110) • Outer R=100 • Inner R=70
       ════════════════════════════════════════════════════════ -->

  <!-- Segmento 1 (verde): arriba-izquierda →  arriba-derecha -->
  <path d="M 70,30
           A 100,100 0 0,1 150,30
           L 138,50
           A 70,70 0 0,0 82,50
           Z"
        fill="url(#greenGrad)"/>

  <!-- Segmento 2 (naranja): arriba-derecha → abajo -->
  <path d="M 150,30
           A 100,100 0 0,1 130,190
           L 130,160
           A 70,70 0 0,0 138,50
           Z"
        fill="url(#orangeGrad)"/>

  <!-- Segmento 3 (verde oscuro): abajo → arriba-izquierda -->
  <path d="M 130,190
           A 100,100 0 0,1 70,30
           L 82,50
           A 70,70 0 0,0 130,160
           Z"
        fill="#229954"/>

  <!-- ════════════════════════════════════════════════════════
       MANO — sosteniendo el bowl
       Palma en el centro, dedos curvados hacia arriba
       ════════════════════════════════════════════════════════ -->

  <!-- Palma -->
  <ellipse cx="110" cy="135" rx="18" ry="24" fill="#e8d5c4"/>

  <!-- Pulgar izquierdo -->
  <path d="M 95,130 Q 88,125 86,115 Q 85,110 90,110"
        fill="none" stroke="#d4a574" stroke-width="4" stroke-linecap="round"/>

  <!-- Dedos (4) curvados hacia arriba -->
  <path d="M 98,111 Q 98,85 102,70"
        fill="none" stroke="#d4a574" stroke-width="4" stroke-linecap="round"/>
  <path d="M 108,109 Q 108,80 110,62"
        fill="none" stroke="#d4a574" stroke-width="4" stroke-linecap="round"/>
  <path d="M 118,111 Q 118,82 120,68"
        fill="none" stroke="#d4a574" stroke-width="4" stroke-linecap="round"/>
  <path d="M 128,115 Q 130,90 130,75"
        fill="none" stroke="#d4a574" stroke-width="4" stroke-linecap="round"/>

  <!-- ════════════════════════════════════════════════════════
       BOWL — sostenido por la mano
       ════════════════════════════════════════════════════════ -->

  <!-- Cuerpo del bowl (ceramic, redondeado) -->
  <path d="M 90,140
           C 85,160 90,180 110,185
           C 130,180 135,160 130,140
           Z"
        fill="url(#bowlGrad)"/>

  <!-- Rim (borde superior del bowl) -->
  <ellipse cx="110" cy="140" rx="20" ry="8" fill="#e67e22"/>

  <!-- Brillo en el bowl (reflejo realista) -->
  <ellipse cx="100" cy="155" rx="8" ry="12"
           fill="rgba(255,255,255,0.35)"/>

  <!-- ════════════════════════════════════════════════════════
       HOJA VERDE — dentro del bowl, símbolo de alimento
       ════════════════════════════════════════════════════════ -->

  <!-- Hoja principal -->
  <path d="M 110,148
           C 105,155 105,165 110,172
           C 115,165 115,155 110,148
           Z"
        fill="#27ae60"/>

  <!-- Vena central -->
  <line x1="110" y1="148" x2="110" y2="172"
        stroke="#1e8449" stroke-width="1" stroke-linecap="round"/>

</svg>
