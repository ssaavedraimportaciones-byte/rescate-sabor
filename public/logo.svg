<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <!-- Gradiente arco: verde oscuro izq → verde brillante → naranja → naranja -->
    <linearGradient id="arcGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%"   stop-color="#1b7a30"/>
      <stop offset="35%"  stop-color="#3aaa35"/>
      <stop offset="55%"  stop-color="#c47a10"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>

    <!-- Bowl: verde claro arriba-izq → verde oscuro abajo-der -->
    <linearGradient id="bowlGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%"   stop-color="#6dcf50"/>
      <stop offset="35%"  stop-color="#3aaa35"/>
      <stop offset="100%" stop-color="#1b6b28"/>
    </linearGradient>

    <!-- Brillo radial bowl -->
    <radialGradient id="bowlShine" cx="28%" cy="22%" r="50%">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.55)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- Hoja -->
    <linearGradient id="leafGrad" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%"   stop-color="#1b6b28"/>
      <stop offset="100%" stop-color="#3aaa35"/>
    </linearGradient>

    <!-- Aro naranja -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#e07820"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
  </defs>

  <!-- ════════ ARCO INFERIOR (detrás del bowl) ════════ -->
  <path d="M 385,210 A 140,140 0 0,1 115,210"
        fill="none" stroke="url(#arcGrad)" stroke-width="36" stroke-linecap="butt"/>

  <!-- ════════ BOWL (encima del arco inferior) ════════ -->
  <!-- Cuerpo del bowl -->
  <path d="M 112,222 C 108,375 250,385 250,385 C 250,385 392,375 388,222 Z"
        fill="url(#bowlGrad)"/>
  <!-- Brillo 3D -->
  <path d="M 112,222 C 108,375 250,385 250,385 C 250,385 392,375 388,222 Z"
        fill="url(#bowlShine)"/>
  <!-- Brillo lateral izquierdo -->
  <path d="M 135,262 Q 120,318 132,368"
        fill="none" stroke="rgba(255,255,255,0.42)" stroke-width="30" stroke-linecap="round"/>

  <!-- Borde blanco alrededor del aro (separación) -->
  <ellipse cx="250" cy="222" rx="142" ry="26" fill="white"/>
  <!-- Aro naranja -->
  <ellipse cx="250" cy="222" rx="138" ry="23" fill="url(#rimGrad)"/>
  <!-- Reflejo interior blanco -->
  <ellipse cx="250" cy="219" rx="115" ry="16" fill="rgba(255,255,255,0.30)"/>

  <!-- Base del bowl -->
  <rect x="200" y="382" width="100" height="16" rx="8"  fill="#156b24"/>
  <ellipse cx="250" cy="398"  rx="68"  ry="13" fill="#1a7030"/>

  <!-- ════════ ARCO SUPERIOR ════════ -->
  <path d="M 115,210 A 140,140 0 0,1 385,210"
        fill="none" stroke="url(#arcGrad)" stroke-width="36" stroke-linecap="butt"/>

  <!-- ════════ FLECHA VERDE izquierda → apunta ARRIBA ════════ -->
  <polygon points="0,-42 32,20 -32,20"
           transform="translate(115,210) rotate(0)"
           fill="#1b7a30"/>

  <!-- ════════ FLECHA NARANJA derecha → apunta ABAJO ════════ -->
  <polygon points="0,-42 32,20 -32,20"
           transform="translate(385,210) rotate(180)"
           fill="#f57c00"/>

  <!-- ════════ TENEDOR naranja (izquierda del centro) ════════ -->
  <!-- Tine izquierdo -->
  <rect x="186" y="115" width="14" height="76" rx="7"  fill="#f57c00"/>
  <!-- Tine central -->
  <rect x="207" y="115" width="14" height="76" rx="7"  fill="#f57c00"/>
  <!-- Tine derecho -->
  <rect x="228" y="115" width="14" height="76" rx="7"  fill="#f57c00"/>
  <!-- Barra -->
  <rect x="186" y="185" width="56"  height="14" rx="7"  fill="#f57c00"/>
  <!-- Mango -->
  <rect x="196" y="198" width="36"  height="82" rx="18" fill="#f57c00"/>

  <!-- ════════ HOJAS verdes (derecha del centro) ════════ -->
  <!-- Hoja trasera (más a la izquierda y detrás) -->
  <path d="M 275,220 C 268,218 262,148 294,112 C 320,116 313,215 275,220 Z"
        fill="url(#leafGrad)" opacity="0.88"/>
  <line x1="275" y1="220" x2="294" y2="116"
        stroke="#156b24" stroke-width="4" stroke-linecap="round"/>

  <!-- Hoja delantera (más a la derecha y al frente) -->
  <path d="M 305,220 C 298,218 292,148 324,112 C 350,116 343,215 305,220 Z"
        fill="url(#leafGrad)"/>
  <line x1="305" y1="220" x2="324" y2="116"
        stroke="#156b24" stroke-width="4" stroke-linecap="round"/>
</svg>
