<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 460">
  <defs>
    <!-- Gradiente del arco: verde oscuro izq → verde brillante → naranja → naranja -->
    <linearGradient id="ag" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%"   stop-color="#1b7a30"/>
      <stop offset="28%"  stop-color="#2fa832"/>
      <stop offset="50%"  stop-color="#c47a10"/>
      <stop offset="70%"  stop-color="#e07820"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <!-- Bowl verde degradado -->
    <linearGradient id="bg" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%"   stop-color="#72d44e"/>
      <stop offset="38%"  stop-color="#2fa832"/>
      <stop offset="100%" stop-color="#1b6b28"/>
    </linearGradient>
    <!-- Brillo radial sobre el bowl -->
    <radialGradient id="bs" cx="26%" cy="18%" r="52%">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.55)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <!-- Hojas verde degradado -->
    <linearGradient id="lg" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%"   stop-color="#1b6b28"/>
      <stop offset="100%" stop-color="#3aaa35"/>
    </linearGradient>
  </defs>

  <!-- ══ ARCO INFERIOR detrás del bowl ══ -->
  <path d="M 373,183 A 123,123 0 0,1 127,183"
        fill="none" stroke="url(#ag)" stroke-width="34" stroke-linecap="butt"/>

  <!-- ══ BOWL cuerpo verde (encima del arco inferior) ══ -->
  <path d="M 126,205 C 122,348 250,358 250,358 C 250,358 378,348 374,205 Z"
        fill="url(#bg)"/>
  <!-- Brillo 3D radial -->
  <path d="M 126,205 C 122,348 250,358 250,358 C 250,358 378,348 374,205 Z"
        fill="url(#bs)"/>
  <!-- Reflejo lateral izquierdo (línea de luz curva) -->
  <path d="M 148,240 Q 133,295 143,342"
        fill="none" stroke="rgba(255,255,255,0.42)" stroke-width="26" stroke-linecap="round"/>

  <!-- Separador blanco alrededor del aro -->
  <ellipse cx="250" cy="205" rx="130" ry="23" fill="white"/>
  <!-- Aro naranja -->
  <ellipse cx="250" cy="205" rx="124" ry="19" fill="#f57c00"/>
  <!-- Reflejo blanco interior del aro -->
  <ellipse cx="250" cy="202" rx="104" ry="13" fill="rgba(255,255,255,0.30)"/>

  <!-- Base del bowl -->
  <rect x="208" y="355" width="84" height="14" rx="7" fill="#156b24"/>
  <ellipse cx="250" cy="369" rx="56" ry="10" fill="#1a7030"/>

  <!-- ══ ARCO SUPERIOR encima del bowl ══ -->
  <path d="M 127,183 A 123,123 0 0,1 373,183"
        fill="none" stroke="url(#ag)" stroke-width="34" stroke-linecap="butt"/>

  <!-- ══ FLECHA VERDE izquierda → apunta ARRIBA ══ -->
  <polygon points="0,-44 32,22 -32,22"
           transform="translate(127,183) rotate(0)"
           fill="#1b7a30"/>

  <!-- ══ FLECHA NARANJA derecha → apunta ABAJO ══ -->
  <polygon points="0,-44 32,22 -32,22"
           transform="translate(373,183) rotate(180)"
           fill="#f57c00"/>

  <!-- ══ TENEDOR naranja — izquierda del centro ══ -->
  <!-- Tine izquierdo -->
  <rect x="185" y="105" width="12" height="70" rx="6" fill="#f57c00"/>
  <!-- Tine derecho -->
  <rect x="206" y="105" width="12" height="70" rx="6" fill="#f57c00"/>
  <!-- Barra conectora -->
  <rect x="185" y="172" width="33"  height="12" rx="6" fill="#f57c00"/>
  <!-- Mango -->
  <rect x="191" y="183" width="21"  height="70" rx="10" fill="#f57c00"/>

  <!-- ══ HOJAS verdes — derecha del centro ══ -->
  <!-- Hoja trasera (más izquierda y detrás) -->
  <path d="M 280,205
           C 274,190 264,145 278,102
           C 286,93  302,93  310,102
           C 324,145 314,190 308,205 Z"
        fill="url(#lg)" opacity="0.88"/>
  <line x1="294" y1="205" x2="294" y2="103"
        stroke="#156b24" stroke-width="3" stroke-linecap="round"/>

  <!-- Hoja delantera (más derecha y al frente) -->
  <path d="M 306,205
           C 300,190 290,145 304,102
           C 312,93  328,93  336,102
           C 350,145 340,190 334,205 Z"
        fill="url(#lg)"/>
  <line x1="320" y1="205" x2="320" y2="103"
        stroke="#156b24" stroke-width="3" stroke-linecap="round"/>
</svg>
