<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 480">
  <defs>
    <linearGradient id="ag" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%"   stop-color="#1b7a30"/>
      <stop offset="30%"  stop-color="#2fa832"/>
      <stop offset="52%"  stop-color="#a07828"/>
      <stop offset="72%"  stop-color="#e07820"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="bg" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%"   stop-color="#72d44e"/>
      <stop offset="40%"  stop-color="#2fa832"/>
      <stop offset="100%" stop-color="#1b6b28"/>
    </linearGradient>
    <radialGradient id="bs" cx="28%" cy="22%" r="55%">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.6)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <linearGradient id="lg" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%"   stop-color="#1b6b28"/>
      <stop offset="100%" stop-color="#3aaa35"/>
    </linearGradient>
  </defs>

  <!-- ARCO INFERIOR detrás del bowl -->
  <path d="M 382,193 A 133,133 0 0,1 118,193"
        fill="none" stroke="url(#ag)" stroke-width="38" stroke-linecap="butt"/>

  <!-- BOWL CUERPO encima del arco inferior -->
  <path d="M 116,210 C 112,375 250,383 250,383 C 250,383 388,375 384,210 Z"
        fill="url(#bg)"/>
  <path d="M 116,210 C 112,375 250,383 250,383 C 250,383 388,375 384,210 Z"
        fill="url(#bs)"/>
  <!-- Brillo lateral izquierdo -->
  <path d="M 138,248 Q 124,305 134,358"
        fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="28" stroke-linecap="round"/>

  <!-- Separador blanco antes del aro -->
  <ellipse cx="250" cy="210" rx="136" ry="24" fill="white"/>
  <!-- Aro naranja -->
  <ellipse cx="250" cy="210" rx="132" ry="20" fill="#f57c00"/>
  <!-- Reflejo blanco interior -->
  <ellipse cx="250" cy="207" rx="110" ry="14" fill="rgba(255,255,255,0.32)"/>

  <!-- BASE del bowl -->
  <rect x="202" y="380" width="96" height="15" rx="7.5" fill="#156b24"/>
  <ellipse cx="250" cy="395" rx="64" ry="11" fill="#1a7030"/>

  <!-- ARCO SUPERIOR encima del bowl -->
  <path d="M 118,193 A 133,133 0 0,1 382,193"
        fill="none" stroke="url(#ag)" stroke-width="38" stroke-linecap="butt"/>

  <!-- FLECHA VERDE izquierda apunta ARRIBA -->
  <polygon points="0,-46 34,22 -34,22"
           transform="translate(118,193) rotate(0)"
           fill="#1b7a30"/>

  <!-- FLECHA NARANJA derecha apunta ABAJO -->
  <polygon points="0,-46 34,22 -34,22"
           transform="translate(382,193) rotate(180)"
           fill="#f57c00"/>

  <!-- TENEDOR naranja — izquierda del centro -->
  <!-- Tine izq -->
  <rect x="188" y="105" width="13" height="72" rx="6.5" fill="#f57c00"/>
  <!-- Tine der -->
  <rect x="210" y="105" width="13" height="72" rx="6.5" fill="#f57c00"/>
  <!-- Barra -->
  <rect x="188" y="173" width="35"  height="13" rx="6.5" fill="#f57c00"/>
  <!-- Mango -->
  <rect x="194" y="185" width="23"  height="76" rx="11"  fill="#f57c00"/>

  <!-- HOJAS verdes — derecha del centro -->
  <!-- Hoja trasera -->
  <path d="M 278,212
           C 262,205 258,150 272,108
           C 280,98  302,98  310,108
           C 324,150 320,205 304,212 Z"
        fill="url(#lg)" opacity="0.90"/>
  <line x1="291" y1="212" x2="291" y2="108"
        stroke="#156b24" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Hoja delantera -->
  <path d="M 300,212
           C 284,205 280,150 294,108
           C 302,98  324,98  332,108
           C 346,150 342,205 326,212 Z"
        fill="url(#lg)"/>
  <line x1="313" y1="212" x2="313" y2="108"
        stroke="#156b24" stroke-width="3.5" stroke-linecap="round"/>
</svg>
