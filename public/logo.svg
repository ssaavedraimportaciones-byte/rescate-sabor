<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#ea8c1a"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="bowlGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="bowlShine" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#15803d" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Flecha circular - parte naranja (lado derecho, arriba) -->
  <path d="M100 18 A82 82 0 0 1 182 100" fill="none" stroke="#f97316" stroke-width="13" stroke-linecap="round"/>
  <!-- Flecha circular - parte verde (lado izquierdo, abajo) -->
  <path d="M100 182 A82 82 0 0 1 18 100" fill="none" stroke="#16a34a" stroke-width="13" stroke-linecap="round"/>
  <!-- Flecha circular - parte gradiente superior izquierda -->
  <path d="M18 100 A82 82 0 0 1 100 18" fill="none" stroke="url(#arrowGrad)" stroke-width="13" stroke-linecap="round"/>
  <!-- Flecha circular - parte gradiente inferior derecha -->
  <path d="M182 100 A82 82 0 0 1 100 182" fill="none" stroke="url(#arrowGrad)" stroke-width="13" stroke-linecap="round"/>

  <!-- Punta de flecha derecha (naranja) -->
  <polygon points="182,88 172,100 192,100" fill="#f97316"/>
  <!-- Punta de flecha izquierda (verde) -->
  <polygon points="18,112 28,100 8,100" fill="#16a34a"/>

  <!-- Plato/base naranja -->
  <ellipse cx="100" cy="128" rx="38" ry="7" fill="#f97316"/>
  <ellipse cx="100" cy="125" rx="42" ry="5" fill="#f97316" opacity="0.7"/>

  <!-- Bowl verde -->
  <path d="M62 105 Q62 140 100 142 Q138 140 138 105 Z" fill="url(#bowlGrad)"/>
  <!-- Borde superior del bowl -->
  <ellipse cx="100" cy="105" rx="38" ry="6" fill="#22c55e"/>
  <!-- Brillo del bowl -->
  <path d="M68 112 Q70 135 85 138" fill="none" stroke="url(#bowlShine)" stroke-width="5" stroke-linecap="round"/>

  <!-- Tenedor naranja -->
  <rect x="87" y="72" width="3" height="28" rx="1.5" fill="#f97316"/>
  <rect x="84" y="72" width="2" height="14" rx="1" fill="#f97316"/>
  <rect x="90" y="72" width="2" height="14" rx="1" fill="#f97316"/>
  <rect x="93" y="72" width="2" height="14" rx="1" fill="#f97316"/>

  <!-- Hojas verdes -->
  <path d="M104 88 C104 88 98 76 108 70 C114 78 108 88 104 88Z" fill="#16a34a"/>
  <path d="M110 92 C110 92 106 79 118 75 C122 84 114 92 110 92Z" fill="#22c55e"/>
  <path d="M104 88 L108 76" stroke="#15803d" stroke-width="1.2" stroke-linecap="round"/>
</svg>
