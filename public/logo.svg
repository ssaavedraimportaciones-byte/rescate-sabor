<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>

    <!-- Gradiente para las flechas: verde vivo → dorado → naranja vivo (evita el marrón) -->
    <linearGradient id="ag" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#156b24"/>
      <stop offset="35%"  stop-color="#38b530"/>
      <stop offset="48%"  stop-color="#c8a000"/>
      <stop offset="62%"  stop-color="#e87500"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>

    <!-- Bowl: radial gradient -->
    <radialGradient id="bg" cx="30%" cy="22%" r="78%">
      <stop offset="0%"   stop-color="#82e86d"/>
      <stop offset="55%"  stop-color="#1e9628"/>
      <stop offset="100%" stop-color="#0c4f18"/>
    </radialGradient>

    <!-- Hoja -->
    <linearGradient id="lg" x1="25%" y1="0%" x2="75%" y2="100%">
      <stop offset="0%"   stop-color="#52d43e"/>
      <stop offset="100%" stop-color="#0c4f18"/>
    </linearGradient>

  </defs>

  <!-- ══════════════════════════════════════════
       FLECHAS CIRCULARES — filled paths (premium)
       Centro (100,96) · outer R=79 · inner R=61
       ══════════════════════════════════════════ -->

  <!-- Flecha SUPERIOR: de izquierda a derecha sobre la cima
       Arrowhead en el extremo derecho (apunta abajo) -->
  <path d="M 21,96
           A 79,79 0 0,1 179,96
           L 170,114
           L 161,96
           A 61,61 0 0,0 39,96
           Z"
        fill="url(#ag)"/>

  <!-- Flecha INFERIOR: de derecha a izquierda bajo el fondo
       Arrowhead en el extremo izquierdo (apunta arriba) -->
  <path d="M 179,96
           A 79,79 0 0,1 21,96
           L 30,78
           L 39,96
           A 61,61 0 0,0 161,96
           Z"
        fill="url(#ag)"/>

  <!-- ══════════════════════════════════════════
       BOWL
       ══════════════════════════════════════════ -->

  <!-- Cuerpo -->
  <path d="M 45,104
           C 43,156 67,182 100,184
           C 133,182 157,156 155,104 Z"
        fill="url(#bg)"/>

  <!-- Gloss crescent (reflejo realista, no un óvalo) -->
  <path d="M 60,116 C 53,138 55,163 65,177
           C 57,162 55,137 63,116 Z"
        fill="rgba(255,255,255,0.40)"/>

  <!-- Rim naranja -->
  <ellipse cx="100" cy="104" rx="55" ry="10" fill="#e87500"/>
  <!-- Interior blanco del rim -->
  <ellipse cx="100" cy="102" rx="46" ry="6.5" fill="rgba(255,255,255,0.32)"/>

  <!-- Base simple -->
  <rect x="88" y="181" width="24" height="7" rx="3.5" fill="#0e4a1a"/>

  <!-- ══════════════════════════════════════════
       TENEDOR — path vectorial completo
       Centro x≈83, dientes y=40–68, mango y=73–108
       ══════════════════════════════════════════ -->
  <path d="
    M 90,108  Q 90,112 83,112  Q 76,112 76,108
    L 76,73
    L 70,68
    L 70,44   Q 70,40 73.5,40  Q 77,40 77,44
    L 77,68   L 80,68
    L 80,44   Q 80,40 83.5,40  Q 87,40 87,44
    L 87,68   L 90,68
    L 90,44   Q 90,40 93.5,40  Q 97,40 97,44
    L 97,68
    L 90,73
    Z"
    fill="#f57c00"/>

  <!-- ══════════════════════════════════════════
       HOJA — bezier premium
       ══════════════════════════════════════════ -->
  <path d="M 120,101
           C 103,86 102,55 120,38
           C 138,55 137,86 120,101 Z"
        fill="url(#lg)"/>
  <!-- Vena central -->
  <line x1="120" y1="101" x2="120" y2="42"
        stroke="rgba(12,79,24,0.50)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Venas laterales -->
  <line x1="120" y1="73"  x2="111" y2="59"
        stroke="rgba(12,79,24,0.28)" stroke-width="1" stroke-linecap="round"/>
  <line x1="120" y1="73"  x2="129" y2="59"
        stroke="rgba(12,79,24,0.28)" stroke-width="1" stroke-linecap="round"/>

</svg>
