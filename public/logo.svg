  <path d="M100 36 C100 36 120 18 128 30 C120 37 100 36 100 36Z" fill="#22c55e"/>
  <line x1="100" y1="36" x2="100" y2="18" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>
</svg>
